name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node.js 24
        with:
          python-version: '3.12'
      - name: Build offline release from pinned payloads
        run: python tools/build_release.py --download-payloads
      - name: Validate PowerShell and key handling
        shell: pwsh
        run: |
          ./tests/Test-Repair-Package.ps1
          ./tests/Test-PublicKey.ps1
      - name: Verify generated key pairing and private-key isolation
        run: python tests/test_client_pairing.py
      - name: Test diagnostics and repair with mocked Windows APIs
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./tests/Test-Repair-Diagnostics.ps1
      - name: Verify Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/Test-Repair-Package.ps1
          ./tests/Test-PublicKey.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: offline-kit-${{ matrix.os }}
          path: dist/*
