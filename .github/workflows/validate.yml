name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build offline release from pinned payloads
        run: python tools/build_release.py --download-payloads
      - name: Validate PowerShell and key handling
        shell: pwsh
        run: |
          ./tests/Test-Repair-Package.ps1
          ./tests/Test-PublicKey.ps1
      - name: Verify generated key pairing and private-key isolation
        run: python tests/test_client_pairing.py
      - name: Test diagnostics and repair with mocked Windows APIs
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./tests/Test-Repair-Diagnostics.ps1
      - name: Verify Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/Test-Repair-Package.ps1
          ./tests/Test-PublicKey.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: offline-kit-${{ matrix.os }}
          path: dist/*
